version: "2"

run:
  # Lint integration tests too; they are excluded from plain builds by this tag.
  build-tags:
    - integration

linters:
  default: none
  enable:
    - errcheck
    - govet
    - gosec
    - ineffassign
    - misspell
    - staticcheck
    - unused
  exclusions:
    generated: strict

formatters:
  enable:
    - gofmt
    - goimports
